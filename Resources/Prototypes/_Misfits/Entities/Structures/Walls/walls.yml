# Walls converted from the supplied SS13 DMIs.
# BaseWall has no Destructible or RCDDeconstructable component, making these walls invincible.
- type: entity
  abstract: true
  parent: BaseWall
  id: WallMisfitsBase
  suffix: Misfits, Indestructible
  components:
  - type: Sprite
    state: wall0
  - type: Icon
    state: full
  - type: IconSmooth
    mode: CardinalFlags
    key: walls
    base: wall

- type: entity
  parent: WallMisfitsBase
  id: WallMisfitsWoodwall
  name: Misfits wood wall
